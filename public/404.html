<!doctype html>

<html lang="en">

  <head>

    <title>TaskFlow — Page Not Found</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">

    <style>

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f9fafb;
        font-family: Arial, sans-serif;
      }

      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .error-card {
        background: #ffffff;
        width: 100%;
        max-width: 500px;
        padding: 48px 32px;
        text-align: center;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      .error-code {
        font-size: 6rem;
        font-weight: 700;
        line-height: 1;
        color: #111827;
        margin-bottom: 16px;
      }

      .error-card h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #111827;
        margin-bottom: 24px;
      }

      .error-card h2 {
        font-size: 1.75rem;
        font-weight: 600;
        color: #374151;
        margin-bottom: 12px;
      }

      .error-card p {
        color: #6b7280;
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 28px;
      }

      .error-card a {
        display: inline-block;
        background: #111827;
        color: #ffffff;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.2s ease;
      }

      .error-card a:hover {
        background: #374151;
      }
    </style>

  </head>

  <body>

    <main>

      <div class="error-card">

        <h1>TaskFlow</h1>

        <div class="error-code">404</div>

        <h2>Page Not Found</h2>

        <p>
          You encountered a webpage error.
          The page you're looking for may have moved or no longer exists.
        </p>

        <a href="/">Back to TaskFlow</a>

      </div>

    </main>

  </body>

</html>
